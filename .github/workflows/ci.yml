name: Offline verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/expense_test
      GEMINI_FREE_TIER_CONFIRMED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m evals.run
      - run: npm ci --prefix web && npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: offline-results
          path: docs/offline-results.json
